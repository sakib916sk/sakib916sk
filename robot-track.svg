<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Animated line follower robot driving along a black line">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff3b3b" stop-opacity=".9"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
    <path id="track" pathLength="1000" d="M60,120 C170,30 290,190 430,115 S700,30 820,115 S930,150 950,110"/>
  </defs>
  <rect width="1000" height="200" rx="18" fill="url(#bg)"/>
  <!-- floor tiles -->
  <g stroke="#ffffff" stroke-opacity=".06">
    <path d="M0 50H1000M0 100H1000M0 150H1000"/><path d="M125 0V200M250 0V200M375 0V200M500 0V200M625 0V200M750 0V200M875 0V200"/>
  </g>
  <!-- black tape line -->
  <use href="#track" fill="none" stroke="#020617" stroke-width="16" stroke-linecap="round"/>
  <!-- traced path (green) that follows the robot -->
  <use href="#track" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.9;0.95;1" dur="10s" repeatCount="indefinite"/>
  </use>
  <!-- robot -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1;0" keyTimes="0;0.9;0.95;1" calcMode="linear">
      <mpath href="#track"/>
    </animateMotion>
    <ellipse cx="22" cy="0" rx="26" ry="14" fill="url(#glow)">
      <animate attributeName="opacity" values="1;.35;1" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-15" y="-13" width="9" height="6" rx="2" fill="#0b1220"/>
    <rect x="-15" y="7" width="9" height="6" rx="2" fill="#0b1220"/>
    <rect x="-18" y="-9" width="36" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="-9" y="-6" width="10" height="12" rx="1.5" fill="#0ea5e9"/>
    <rect x="3" y="-5" width="7" height="10" rx="1.5" fill="#ef4444"/>
    <rect x="16" y="-8" width="3" height="16" rx="1" fill="#ff3b3b"/>
  </g>
  <text x="500" y="186" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#94a3b8">while (true) { follow(line); keep_learning(); }</text>
</svg>
